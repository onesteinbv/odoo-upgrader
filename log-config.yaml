version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "[%(asctime)s] %(levelname)s %(message)s"
  access:
    format: '[%(asctime)s] %(levelname)s %(message)s'

handlers:
  default:
    class: logging.StreamHandler
    stream: ext://sys.stderr
    formatter: default

  access:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: access

loggers:
  uvicorn.error:
    level: INFO
    handlers: [default]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: false

root:
  level: INFO
  handlers: [default]
  propagate: false